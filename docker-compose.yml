# gastito — full stack: Postgres + spliit web + Gowa + WhatsApp bot.
# Copy .env.example to .env and fill in the secrets before `docker compose up`.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [gastito]

  web:
    build: ./web
    image: gastito-web:latest
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      # Prisma reads these; the container entrypoint runs `prisma migrate deploy`.
      POSTGRES_PRISMA_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      POSTGRES_URL_NON_POOLING: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NEXT_PUBLIC_DEFAULT_CURRENCY_CODE: ${NEXT_PUBLIC_DEFAULT_CURRENCY_CODE:-USD}
      # gastito: shared secret guarding /api/bot/* (must match the bot).
      BOT_INGEST_SECRET: ${BOT_INGEST_SECRET}
      # gastito: shared user/pass that gates the web UI (Basic Auth). Leave
      # unset for an open local dev; set both to turn the gate on.
      WEB_BASIC_AUTH_USER: ${WEB_BASIC_AUTH_USER:-}
      WEB_BASIC_AUTH_PASS: ${WEB_BASIC_AUTH_PASS:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [gastito]

  gowa:
    image: aldinokemal2104/go-whatsapp-web-multidevice:${GOWA_IMAGE_TAG:-latest}
    command: ['rest']
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      APP_PORT: '4000'
      APP_HOST: 0.0.0.0
      APP_BASIC_AUTH: ${GOWA_BASIC_AUTH_USER}:${GOWA_BASIC_AUTH_PASS}
      APP_DEBUG: 'false'
      DB_URI: 'file:storages/whatsapp.db?_foreign_keys=on'
      # Load-bearing for voice notes: backs /message/:id/download, the fallback
      # the bot uses when the webhook's media path is already gone.
      WHATSAPP_CHAT_STORAGE: 'true'
      # Voice notes: Gowa downloads the audio and puts its path in the webhook.
      # Set explicitly even though it's the upstream default — GOWA_IMAGE_TAG
      # floats on `latest`, and relying on a default in an auto-updating image is
      # how this feature silently stops working after a `docker compose pull`.
      WHATSAPP_AUTO_DOWNLOAD_MEDIA: 'true'
      WHATSAPP_AUTO_REPLY: ''
      WHATSAPP_AUTO_MARK_READ: 'false'
      # Inbound messages are POSTed to the bot, signed with the shared secret.
      WHATSAPP_WEBHOOK: 'http://bot:8000/webhooks/gowa/'
      WHATSAPP_WEBHOOK_SECRET: ${GOWA_WEBHOOK_SECRET}
      WHATSAPP_WEBHOOK_EVENTS: 'message'
      # Don't fire webhooks for our own outgoing messages -> no reply loop.
      WHATSAPP_WEBHOOK_INCLUDE_OUTGOING: 'false'
    volumes:
      - ./gowa/storages:/app/storages
      # Downloaded media (voice notes) — without this it lives only in the
      # container's writable layer: lost on rebuild and growing without bound.
      - ./gowa/statics:/app/statics
    networks: [gastito]

  bot:
    build: ./bot
    image: gastito-bot:latest
    restart: unless-stopped
    ports:
      - '8000:8000'
    environment:
      LLM_PRIMARY_TOKEN: ${LLM_PRIMARY_TOKEN}
      LLM_PRIMARY_BASE_URL: ${LLM_PRIMARY_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_PRIMARY_MODEL: ${LLM_PRIMARY_MODEL:-llama-3.3-70b-versatile}
      LLM_SECONDARY_TOKEN: ${LLM_SECONDARY_TOKEN:-}
      LLM_SECONDARY_BASE_URL: ${LLM_SECONDARY_BASE_URL:-https://api.openai.com/v1}
      LLM_SECONDARY_MODEL: ${LLM_SECONDARY_MODEL:-gpt-4o-mini}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.7}
      BOT_REPLY_DELAY_SECONDS: ${BOT_REPLY_DELAY_SECONDS:-2}
      # Voice notes (Gemini-only — gpt-4o-mini can't hear, so no fallback).
      VOICE_NOTES_ENABLED: ${VOICE_NOTES_ENABLED:-true}
      GEMINI_TRANSCRIBE_MODEL: ${GEMINI_TRANSCRIBE_MODEL:-gemini-flash-latest}
      OPENAI_AUDIO_KEY: ${OPENAI_AUDIO_KEY:-}
      OPENAI_AUDIO_BASE_URL: ${OPENAI_AUDIO_BASE_URL:-https://api.openai.com/v1}
      OPENAI_AUDIO_MODEL: ${OPENAI_AUDIO_MODEL:-gpt-4o-mini-transcribe}
      VOICE_TRANSCRIBE_TIMEOUT_SECONDS: ${VOICE_TRANSCRIBE_TIMEOUT_SECONDS:-90}
      VOICE_MAX_BYTES: ${VOICE_MAX_BYTES:-8388608}
      VOICE_MAX_SECONDS: ${VOICE_MAX_SECONDS:-120}
      WEB_INGEST_URL: 'http://web:3000/api/bot'
      BOT_INGEST_SECRET: ${BOT_INGEST_SECRET}
      GOWA_BASE_URL: 'http://gowa:4000'
      GOWA_BASIC_AUTH_USER: ${GOWA_BASIC_AUTH_USER}
      GOWA_BASIC_AUTH_PASS: ${GOWA_BASIC_AUTH_PASS}
      GOWA_WEBHOOK_SECRET: ${GOWA_WEBHOOK_SECRET}
      DOLARAPI_URL: ${DOLARAPI_URL:-https://dolarapi.com}
      FX_GENERAL_URL: ${FX_GENERAL_URL:-https://open.er-api.com}
    depends_on:
      - web
      - gowa
    networks: [gastito]

networks:
  gastito:
    driver: bridge
